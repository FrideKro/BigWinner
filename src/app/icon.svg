<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    大赢家 Logo：🀄 款式——白色麻将牌 + 正中红「中」
    宽牌身 + 侧面厚度 / 明暗渐变 / 倒角亮线，模拟实物立体感
    与 src/components/LogoMark.tsx 保持同一设计，改动请两处同步
  -->
  <defs>
    <linearGradient id="bw-face" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset="0.55" stop-color="#f5f1e4"/>
      <stop offset="1" stop-color="#e5dec8"/>
    </linearGradient>
    <linearGradient id="bw-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8cfb8"/>
      <stop offset="1" stop-color="#ada17f"/>
    </linearGradient>
    <linearGradient id="bw-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bw-contact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5c3d" stop-opacity="0"/>
      <stop offset="1" stop-color="#6b5c3d" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="bw-zhong" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e23430"/>
      <stop offset="1" stop-color="#c81e1e"/>
    </linearGradient>
    <filter id="bw-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
    <clipPath id="bw-face-clip">
      <rect x="86" y="32" width="340" height="428" rx="50"/>
    </clipPath>
  </defs>

  <!-- 牌影（本体被牌面覆盖，仅投影可见） -->
  <g filter="url(#bw-shadow)">
    <rect x="86" y="32" width="340" height="428" rx="50" fill="#0f172a"/>
  </g>

  <!-- 牌侧面（厚度 18px，上亮下暗） -->
  <rect x="86" y="50" width="340" height="428" rx="50" fill="url(#bw-side)"/>

  <!-- 牌面 -->
  <rect x="86" y="32" width="340" height="428" rx="50" fill="url(#bw-face)" stroke="#c9c1ab" stroke-width="5"/>

  <!-- 牌面光泽（顶部）与底部接触阴影 -->
  <g clip-path="url(#bw-face-clip)">
    <rect x="86" y="32" width="340" height="170" fill="url(#bw-sheen)"/>
    <rect x="86" y="340" width="340" height="120" fill="url(#bw-contact)"/>
  </g>

  <!-- 内倒角亮线 -->
  <rect x="94" y="40" width="324" height="412" rx="43" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>

  <!-- 红中（左竖 / 镂空 / 竖笔 / 镂空 / 右竖） -->
  <g fill="url(#bw-zhong)">
    <rect x="151" y="146" width="210" height="46" rx="6"/>
    <rect x="151" y="248" width="210" height="46" rx="6"/>
    <rect x="151" y="146" width="46" height="148" rx="6"/>
    <rect x="315" y="146" width="46" height="148" rx="6"/>
    <rect x="233" y="86" width="46" height="320" rx="8"/>
  </g>
</svg>
