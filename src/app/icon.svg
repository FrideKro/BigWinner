<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    大赢家 Logo：四方围桌 · 牌局赢家
    金色圆桌光环象征台面零和闭环，四席好友环绕（北席大赢家红、南席绿、东西银白，呼应红赢绿输），
    圆桌中央立起三尖黄金皇冠
    与 src/components/LogoMark.tsx 保持同一设计，改动请两处同步
  -->
  <defs>
    <linearGradient id="bw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#131c33"/>
      <stop offset="1" stop-color="#241812"/>
    </linearGradient>
    <radialGradient id="bw-table" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </radialGradient>
    <linearGradient id="bw-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="bw-red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="0.4" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="bw-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bw-bg)"/>

  <!-- 牌局圆桌金环（代表好友围桌与零和配平闭环） -->
  <circle cx="256" cy="256" r="158" fill="url(#bw-table)" stroke="url(#bw-gold)" stroke-width="18"/>
  <circle cx="256" cy="256" r="126" fill="none" stroke="url(#bw-gold)" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="16 12"/>

  <!-- 四方席位好友圆章（东西南北围坐） -->
  <g stroke="#0f172a" stroke-width="12">
    <!-- 北席：本场大赢家（红＝赢，略大突出） -->
    <circle cx="256" cy="86" r="42" fill="url(#bw-red)"/>
    <!-- 南席：绿＝输（呼应红赢绿输业务规则） -->
    <circle cx="256" cy="426" r="34" fill="url(#bw-green)"/>
    <!-- 西席与东席：两位同桌好友（高亮暖银白） -->
    <circle cx="86" cy="256" r="34" fill="#f1f5f9"/>
    <circle cx="426" cy="256" r="34" fill="#f1f5f9"/>
  </g>
  <!-- 北席大赢家金圈加冕环 -->
  <circle cx="256" cy="86" r="42" fill="none" stroke="url(#bw-gold)" stroke-width="6"/>

  <!-- 圆桌中央：大赢家三尖黄金皇冠 -->
  <g transform="translate(0 8)">
    <path d="M178 284 L160 202 L216 240 L256 178 L296 240 L352 202 L334 284 Z" fill="url(#bw-gold)"/>
    <rect x="178" y="294" width="156" height="22" rx="11" fill="url(#bw-gold)"/>
    <circle cx="160" cy="190" r="11" fill="#fef08a"/>
    <circle cx="256" cy="164" r="14" fill="#fef08a"/>
    <circle cx="352" cy="190" r="11" fill="#fef08a"/>
    <circle cx="256" cy="252" r="14" fill="url(#bw-red)"/>
  </g>
</svg>
