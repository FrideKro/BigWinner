services:
  app:
    # 生产部署由 deploy-prod.sh 按 GHCR 镜像 tag 拉取（IMAGE_NAME 由 deploy workflow 注入）；
    # 本地开发仍可用 docker compose up -d --build（镜像标记为 localhost/big-winner:latest）
    image: ${IMAGE_NAME:-localhost/big-winner}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: big_winner_app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ['CMD', 'node', 'healthcheck.js']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
