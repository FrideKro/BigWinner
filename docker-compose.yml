services:
  app:
    # 生产部署由 deploy-prod.sh 按 GHCR 镜像 tag 拉取（IMAGE_NAME 由 deploy workflow 注入）；
    # 本地开发仍可用 docker compose up -d --build（镜像标记为 localhost/big-winner:latest）
    image: ${IMAGE_NAME:-localhost/big-winner}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: big_winner_app
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      - NODE_ENV=production
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_NICKNAME=${ADMIN_NICKNAME:-群主管理员}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DEFAULT_ROOM_FEE=${DEFAULT_ROOM_FEE:-100}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
